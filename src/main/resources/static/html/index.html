<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель администратора — Бронирование</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Университет: Панель управления</h1>
    <p>Система бронирования ресурсов и услуг</p>
</header>

<div id="status-message" class="message hidden"></div>

<main class="container">

    <!-- СЕКЦИЯ РЕГИСТРАЦИИ (СЛЕВА) -->
    <section class="card">
        <h2>Регистрация</h2>
        <form id="register-form" onsubmit="registerUser(event)">
            <div class="form-group">
                <label for="reg-username">Логин / Email</label>
                <input type="text" id="reg-username" placeholder="admin@univ.edu" required>
            </div>
            <div class="form-group">
                <label for="reg-password">Пароль</label>
                <input type="password" id="reg-password" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label for="reg-role">Роль</label>
                <select id="reg-role">
                    <option value="ADMIN">Администратор</option>
                    <option value="USER">Студент / Преподаватель</option>
                </select>
            </div>
            <button type="submit" class="btn-primary full-btn">Зарегистрироваться</button>
        </form>
    </section>

    <!-- СЕКЦИЯ СПИСКА УСЛУГ (СПРАВА) -->
    <section class="card">
        <h2>Доступные услуги / Аудитории</h2>
        <button onclick="fetchServices()">Обновить список (GET /api/services)</button>
        <ul id="services-list" class="list">
            <!-- Заполняется из JS -->
        </ul>
    </section>

    <!-- СЕКЦИЯ КОРЗИНЫ -->
    <section class="card">
        <h2>Временная корзина (TTL)</h2>
        <div id="cart-content">
            <p>Корзина пуста</p>
        </div>
        <div class="cart-actions">
            <button onclick="createBooking()" class="btn-primary">Оформить заявку</button>
            <button onclick="clearCart()" class="btn-danger">Очистить</button>
        </div>
    </section>

    <!-- СЕКЦИЯ ТАБЛИЦЫ ЗАЯВОК -->
    <section class="card">
        <h2>Заявки на бронирование</h2>
        <button onclick="fetchBookings()">Обновить заявки (GET /api/bookings)</button>
        <table class="table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Услуга</th>
                <th>Статус</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody id="bookings-table-body">
            <!-- Заполняется из JS -->
            </tbody>
        </table>
    </section>

</main>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/live2d-widget@3.1.4/lib/L2Dwidget.min.js"></script>
<script>
    L2Dwidget.init({
        "model": {
            "jsonPath": "https://cdn.jsdelivr.net/gh/evrstr/live2d-widget-models/live2d_evrstr/madoka/model.json"
        },
        "display": {
            "position": "right",
            "width": 785,
            "height": 900,
            "hOffset": 60,
            "vOffset": 0
        },
        "mobile": {
            "show": true,
            "scale": 0.3,
            "motion": true
        }
    });
</script>
</body>
</html>
