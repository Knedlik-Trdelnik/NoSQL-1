<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 — Доступ ограничен | Мир Мадоки</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #fffaff;
            --muted: #d3c7e3;
            --line: rgba(255, 235, 250, 0.15);
            --pink: #ff8dca;
            --pink-glow: rgba(255, 141, 202, 0.4);
            --blue: #75d8ff;
            --panel-bg: rgba(21, 12, 49, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink);
            font-family: 'Manrope', sans-serif;
            background: radial-gradient(circle at 72% 10%, #673f9e 0, transparent 25%),
            radial-gradient(circle at 13% 66%, #304c91 0, transparent 24%),
            linear-gradient(145deg, #170c36, #24124d 52%, #192c62);
            background-attachment: fixed;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            opacity: 0.28;
            background-image: radial-gradient(#fff 1px, transparent 1.5px);
            background-size: 38px 38px;
            mask-image: linear-gradient(to bottom, black, transparent 85%);
        }

        /* AMBIENT LIGHTS */
        .ambient {
            position: absolute;
            z-index: -1;
            pointer-events: none;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.3;
        }

        .ambient-one {
            top: -10%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: var(--pink);
        }

        .ambient-two {
            bottom: -10%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: #412285;
        }

        /* CARD CONTAINER */
        .error-card {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--line);
            border-radius: 28px;
            padding: 48px 40px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 141, 202, 0.1);
            position: relative;
            z-index: 10;
        }

        .error-code {
            font-family: 'Unbounded', sans-serif;
            font-size: 80px;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #fff 20%, var(--pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px var(--pink-glow);
            margin-bottom: 8px;
            letter-spacing: -2px;
        }

        .error-badge {
            display: inline-block;
            background: rgba(255, 120, 120, 0.15);
            border: 1px solid rgba(255, 120, 120, 0.3);
            color: #ff7878;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .error-card h1 {
            font-family: 'Unbounded', sans-serif;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--ink);
        }

        .error-card p {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        /* ACTION BUTTON */
        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 28px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--pink) 0%, #d866a6 100%);
            color: #fff;
            font-family: 'Manrope', sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 6px 20px var(--pink-glow);
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(255, 141, 202, 0.6);
        }

        .btn-home:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div class="ambient ambient-one"></div>
<div class="ambient ambient-two"></div>

<div class="error-card">
    <div class="error-code">403</div>
    <div class="error-badge">Access Denied</div>
    <h1>У вас нет доступа</h1>
    <p>Кажется, эта зона закрыта заклинанием или требует дополнительных прав администратора.</p>
    <a href="/user.html" class="btn-home">Вернуться на главную &rarr;</a>
</div>

<!-- Live2D Widget (Madoka) -->
<script src="https://cdn.jsdelivr.net/npm/live2d-widget@3.1.4/lib/L2Dwidget.min.js"></script>
<script>
    window.addEventListener('DOMContentLoaded', () => {
        if (window.L2Dwidget) {
            window.L2Dwidget.init({
                "model": {
                    "jsonPath": "https://cdn.jsdelivr.net/gh/evrstr/live2d-widget-models/live2d_evrstr/madoka/model.json"
                },
                "display": {
                    "position": "right",
                    "width": 380,
                    "height": 480,
                    "hOffset": -80,
                    "vOffset": -20
                },
                "mobile": {
                    "show": true,
                    "scale": 0.3
                }
            });
        }
    });
</script>
</body>
</html>
